<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News AI Chatbot</title>
<style>
  :root {
    --bg: #f5f6f8;
    --bubble-user: #2563eb;
    --bubble-bot: #ffffff;
    --text-user: #ffffff;
    --text-bot: #1f2937;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 20px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    color: #111827;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #6b7280;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    line-height: 1.45;
    font-size: 14.5px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--text-user);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.bot.loading { color: #9ca3af; font-style: italic; }
  .citations {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 12.5px;
  }
  .citations div { margin-bottom: 4px; }
  .citations a { color: #2563eb; text-decoration: none; }
  .citations a:hover { text-decoration: underline; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: #ffffff;
    border-top: 1px solid var(--border);
  }
  input[type=text] {
    flex: 1;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 14.5px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--bubble-user); }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 999px;
    background: var(--bubble-user);
    color: #fff;
    font-size: 14.5px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>News AI Chatbot</h1>
      <p>Tổng hợp bài báo đã crawl từ backend news-ai</p>
    </header>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="question" type="text" placeholder="Nhập câu hỏi, ví dụ: có bài nào về AI không?" autocomplete="off" />
      <button type="submit" id="send-btn">Gửi</button>
    </form>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const formEl = document.getElementById('chat-form');
const inputEl = document.getElementById('question');
const sendBtn = document.getElementById('send-btn');

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function renderBotAnswer(el, data) {
  el.classList.remove('loading');
  el.textContent = data.summary || '(không có nội dung)';
  if (data.citations && data.citations.length > 0) {
    const box = document.createElement('div');
    box.className = 'citations';
    data.citations.forEach((c, i) => {
      const row = document.createElement('div');
      const a = document.createElement('a');
      a.href = c.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = '[' + (i + 1) + '] ' + c.title + ' — ' + c.sourceName
        + (c.publishedAt ? ' (' + c.publishedAt + ')' : '');
      row.appendChild(a);
      box.appendChild(row);
    });
    el.appendChild(box);
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = inputEl.value.trim();
  if (!question) return;

  addMessage(question, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;
  const loadingEl = addMessage('Đang tìm và tổng hợp bài báo...', 'bot loading');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({ question })
    });
    if (!res.ok) {
      loadingEl.classList.remove('loading');
      loadingEl.textContent = 'Lỗi từ server: HTTP ' + res.status;
      return;
    }
    const data = await res.json();
    renderBotAnswer(loadingEl, data);
  } catch (err) {
    loadingEl.classList.remove('loading');
    loadingEl.textContent = 'Không gọi được chatbot: ' + err.message;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
});

addMessage('Xin chào! Hỏi mình về các bài báo đã crawl nhé.', 'bot');
</script>
</body>
</html>
